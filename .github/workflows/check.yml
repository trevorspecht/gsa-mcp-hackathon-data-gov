name: check

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra ui
      - run: make check
      - run: uv run --extra ui pytest -q tests/test_research_ui.py
      - name: Validate Terraform without a backend or credentials
        run: |
          mkdir -p "$RUNNER_TEMP/terraform"
          cd "$RUNNER_TEMP/terraform"
          curl -fsSLO https://releases.hashicorp.com/terraform/1.17.2/terraform_1.17.2_linux_amd64.zip
          curl -fsSLO https://releases.hashicorp.com/terraform/1.17.2/terraform_1.17.2_SHA256SUMS
          grep 'terraform_1.17.2_linux_amd64.zip$' terraform_1.17.2_SHA256SUMS | sha256sum -c -
          unzip terraform_1.17.2_linux_amd64.zip
          ./terraform -chdir="$GITHUB_WORKSPACE/infra" fmt -check
          ./terraform -chdir="$GITHUB_WORKSPACE/infra" init -backend=false -lockfile=readonly
          ./terraform -chdir="$GITHUB_WORKSPACE/infra" validate
