[project]
name = "datagov-semantic-mcp"
version = "0.1.0"
description = "MCP server for plain-language Data.gov discovery and evidence-backed queries of reviewed datasets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastmcp==4.2.1",
  "httpx==0.28.1",
  "pydantic==2.14.3",
  "pydantic-settings==2.16.3",
  "databricks-sdk==0.167.0",
  "truststore==0.10.5",
]

[project.scripts]
datagov-mcp = "datagov_mcp.app:main"
datagov-setup-check = "datagov_mcp.setup_check:main"
datagov-prepare = "datagov_mcp.ingestion:main"
datagov-load = "datagov_mcp.load:main"
datagov-agent = "datagov_mcp.agent:main"

[project.optional-dependencies]
ui = [
    "plotly>=7.1.0",
    "streamlit>=1.67.0",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datagov_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"registry/datasets.json" = "datagov_mcp/data/datasets.json"
"registry/science.json" = "datagov_mcp/data/science.json"

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.5.0",
  "ruff==0.17.5",
  "bandit==1.9.4",
  "pip-audit==2.10.1",
  "detect-secrets==1.5.0",
  "pre-commit==4.7.0",
  "markdown-it-py==4.3.0",
  "python-pptx>=1.0.2",
  "python-docx>=1.2.0",
  "matplotlib>=3.11.2",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff.lint.per-file-ignores]
"scripts/eval_summary.py" = ["E501"]  # page text is laid out line by line
